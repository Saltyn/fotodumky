<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FotoDumky — Один кадр. Одна думка.</title>
  <style>
    body {
      background-color: #0f0f0f;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      text-align: center;
      margin-bottom: 40px;
    }
    h1 { font-weight: 300; letter-spacing: 2px; margin-bottom: 5px; }
    p.tagline { color: #888; font-style: italic; margin-top: 0; }
    
    .card {
      max-width: 900px;
      width: 100%;
      background: #181818;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin-bottom: 50px;
    }
    .card img {
      width: 100%;
      height: auto;
      display: block;
    }
    .card-body {
      padding: 30px;
      text-align: center;
    }
    .thought-title {
      font-size: 1.5rem;
      letter-spacing: 3px;
      color: #7bb384;
      margin-bottom: 15px;
    }
    .thought-text {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #ccc;
      max-width: 650px;
      margin: 0 auto 30px auto;
    }
    .actions {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      padding: 12px 24px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background-color: #ffffff;
      color: #000000;
    }
    .btn-primary:hover { background-color: #dddddd; }
    .btn-secondary {
      border: 1px solid #444;
      color: #aaa;
    }
    .btn-secondary:hover { border-color: #888; color: #fff; }
  </style>
</head>
<body>

  <header>
    <h1>FotoDumky</h1>
    <p class="tagline">One frame. One thought. / Один кадр. Одна думка.</p>
  </header>

  <main>
    <!-- FotoDumka #1 -->
    <article class="card">
      <img src="IMG_4248_READY.jpg" alt="PEACE DOESN'T COME. YOU NOTICE IT">
      <div class="card-body">
        <h2 class="thought-title">PEACE DOESN'T COME. YOU NOTICE IT</h2>
        <p class="thought-text">
          Спокій не приходить ззовні і його не чекають з майбутнього. 
          Він завжди поруч — варто лише зупинитися і помітити світло, яке пробиває темряву.
        </p>
        <div class="actions">
          <!-- Замініть посилання нижче на ваше посилання Ko-fi (Shop item) -->
          <a href="https://ko-fi.com/s/your-photo-link" target="_blank" class="btn btn-primary">
            WANT THE ORIGINAL? ($5)
          </a>
          <!-- Замініть посилання нижче на ваше загальне посилання Ko-fi -->
          <a href="https://ko-fi.com/your-username" target="_blank" class="btn btn-secondary">
            Buy the photographer a coffee ☕
          </a>
        </div>
      </div>
    </article>
  </main>

</body>
</html>
